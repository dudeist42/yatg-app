packages:
  - "backend"
  - "frontend"
  - "packages/*"

allowBuilds:
  '@nestjs/core': false
  '@scarf/scarf': false
  bcrypt: false
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - js-yaml@4.1.2
  - '@babel/core@7.29.1'
  - find-my-way@9.6.1

overrides:
  '@babel/core@<=7.29.0': ^7.29.1
  '@fastify/static@>=8.0.0 <=9.1.0': '>=9.1.1'
  axios@>=1.0.0 <1.15.0: '>=1.15.0'
  esbuild@<=0.24.2: '>=0.25.0'
  fastify@<=5.8.2: '>=5.8.5'
  fastify@>=5.3.2 <=5.8.4: '>=5.8.5'
  follow-redirects@<=1.15.11: '>=1.16.0'
  js-yaml@<3.15.0: ^3.15.0
  js-yaml@>=3.0.0 <3.15.0: ^3.15.0
  js-yaml@>=3.0.0 <3.15.1: ^3.15.1
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  js-yaml@>=4.0.0 <=4.1.1: ^4.1.2
  lodash@<=4.17.23: '>=4.18.0'
  lodash@>=4.0.0 <=4.17.23: '>=4.18.0'
  next@>=16.0.0-beta.0 <16.2.3: '>=16.2.3'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
