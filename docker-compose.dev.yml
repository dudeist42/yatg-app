services:
  postgres-dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - yatg-network
    profiles:
      - db
      - all
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-dev:
    container_name: yatg-backend-dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment:
      - PORT=${BACKEND_PORT}
      - BACKEND_HEALTH_PORT=${BACKEND_HEALTH_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - TMDB_API_URL=${TMDB_API_URL}
      - TMDB_API_TOKEN=${TMDB_API_TOKEN}
      - TMDB_IMAGE_BASE_URL=${TMDB_IMAGE_BASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - PASSWORD_PWNED_VALIDATION_ENABLED=${PASSWORD_PWNED_VALIDATION_ENABLED}
      - PASSWORD_PWNED_VALIDATATION_CACHE_TTL=${PASSWORD_PWNED_VALIDATATION_CACHE_TTL}
      - PASSWORD_PWNED_MAX_CACHE_RECORDS=${PASSWORD_PWNED_MAX_CACHE_RECORDS}
      - PASSWORD_PWNED_HIBP_URL=${PASSWORD_PWNED_HIBP_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - NODE_ENV=${NODE_ENV}
    profiles:
      - all
      - backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    networks:
      - yatg-network
    depends_on:
      postgres-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--tries=1", "--spider", "http://backend-dev:${BACKEND_HEALTH_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend-dev:
    container_name: yatg-frontend-dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      - PORT=${FRONTEND_PORT}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=${NODE_ENV}
    profiles:
      - all
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    networks:
      - yatg-network
    depends_on:
      backend-dev:
        condition: service_healthy
