services:
  
  postgres-prod:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - yatg-network
    profiles:
      - all
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-prod:
    container_name: yatg-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      - PORT=${BACKEND_PORT}
      - BACKEND_HEALTH_PORT=${BACKEND_HEALTH_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - TMDB_API_URL=${TMDB_API_URL}
      - TMDB_API_TOKEN=${TMDB_API_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - PASSWORD_PWNED_VALIDATION_ENABLED=${PASSWORD_PWNED_VALIDATION_ENABLED}
      - PASSWORD_PWNED_VALIDATATION_CACHE_TTL=${PASSWORD_PWNED_VALIDATATION_CACHE_TTL}
      - PASSWORD_PWNED_MAX_CACHE_RECORDS=${PASSWORD_PWNED_MAX_CACHE_RECORDS}
      - PASSWORD_PWNED_HIBP_URL=${PASSWORD_PWNED_HIBP_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - NODE_ENV=${NODE_ENV}
    profiles:
      - all
      - backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - yatg-network
    depends_on:
      postgres-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--tries=1", "--spider", "http://backend-prod:${BACKEND_HEALTH_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend-prod:
    container_name: yatg-frontend-prod
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    environment:
      - PORT=${FRONTEND_PORT}
      - API_URL=${API_URL}
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_TMDB_IMAGE_BASE_URL=${NEXT_PUBLIC_TMDB_IMAGE_BASE_URL}
    profiles:
      - all
      - frontend
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    networks:
      - yatg-network
    depends_on:
      backend-prod:
        condition: service_healthy
    restart: unless-stopped
